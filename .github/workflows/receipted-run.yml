name: receipted-run
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: install deps
        run: pip -q install cryptography
      - name: receipted benchmark run (GitHub executor)
        run: |
          python pocr.py --key .gh-runner.key \
            --input agent_backtest_bench.py \
            --output grid_results.json \
            --provider github-actions:ubuntu-latest:cloud \
            --receipt live/receipt-github-latest.json \
            -- python3 agent_backtest_bench.py --bars 500000 --grid 96 --hourly-usd 0.0064
      - name: arbitrate vs latest Fluence receipt
        run: |
          python pocarb.py live/receipt-fluence-latest.json live/receipt-github-latest.json \
            -o live/verdict-latest.json --key .gh-arbiter.key || true
      - name: commit
        run: |
          rm -f .gh-runner.key .gh-arbiter.key grid_results.json bench_report.json
          git config user.name "aimeta-live"
          git config user.email "live@aimeta.network"
          git add live/
          git commit -m "live: receipted run $(date -u +%FT%TZ)" || echo "no changes"
          git push
